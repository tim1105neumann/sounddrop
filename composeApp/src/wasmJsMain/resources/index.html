<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundDrop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fcf8ff;
        }

        @media (prefers-color-scheme: dark) {
            html, body {
                background: #0f0d17;
                color: #e7e1f0;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .browser-note {
            font-family: system-ui, sans-serif;
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 24px;
            line-height: 1.5;
        }

        #status.failed {
            position: fixed;
            inset: 0;
            overflow: auto;
            max-width: none;
            background: inherit;
            z-index: 10;
        }

        .browser-note code {
            display: block;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(127, 82, 255, 0.12);
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
<noscript>
    <p class="browser-note">
        SoundDrop needs JavaScript and a browser with WebAssembly GC support
        (Chrome 119+, Firefox 120+, Safari 18.2+).
    </p>
</noscript>
<div id="status" class="browser-note">Loading SoundDrop…</div>
<script>
    // Shows a readable message instead of a blank page when the app cannot start.
    (function () {
        var status = document.getElementById("status");
        var failedRequests = [];

        // Record failed downloads so the diagnostics can say which file could not be loaded and why.
        var originalFetch = window.fetch;
        window.fetch = function (input) {
            var url = String((input && input.url) || input);
            return originalFetch.apply(this, arguments).then(
                function (response) {
                    if (!response.ok) failedRequests.push("HTTP " + response.status + " " + url);
                    return response;
                },
                function (error) {
                    failedRequests.push(error + " " + url);
                    throw error;
                }
            );
        };

        // A module declaring one empty struct type validates only where WebAssembly GC is supported.
        function supportsWasmGc() {
            try {
                return WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 95, 0]));
            } catch (e) {
                return false;
            }
        }

        function fail(reason) {
            if (status.classList.contains("failed")) return;
            status.classList.add("failed");
            status.style.display = "";
            // Compose replaces the contents of <body>, so re-attach the message outside of it.
            if (!status.isConnected) document.documentElement.appendChild(status);
            status.innerHTML =
                "<strong>SoundDrop could not start in this browser.</strong><br>" +
                "It needs a browser with WebAssembly garbage collection (Chrome 119+, Firefox 120+, " +
                "Safari 18.2+) that is allowed to download the app's .wasm files. Diagnostics:<code></code>";
            status.querySelector("code").textContent =
                "Error: " + reason + "\n" +
                "WebAssembly: " + (typeof WebAssembly === "object" ? "available" : "missing") + "\n" +
                "WebAssembly GC: " + (typeof WebAssembly === "object" && supportsWasmGc() ? "supported" : "not supported") + "\n" +
                "Failed requests: " + (failedRequests.length ? "\n  " + failedRequests.join("\n  ") : "none") + "\n" +
                "Browser: " + navigator.userAgent;
        }

        // With "?debug" in the address, console output and graphics checks are shown on the page itself, so
        // problems can be diagnosed on phones, where no developer console is available.
        if (/[?&]debug\b/.test(location.search)) {
            var lines = [];
            var panel = document.createElement("pre");
            panel.style.cssText =
                "position:fixed;left:0;right:0;bottom:0;max-height:55%;overflow:auto;margin:0;padding:8px;" +
                "z-index:20;font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;" +
                "background:rgba(0,0,0,0.85);color:#d8ffd8;";
            var record = function (level, args) {
                var text = Array.prototype.map.call(args, function (arg) {
                    try {
                        return arg instanceof Error ? arg.stack || String(arg) :
                            typeof arg === "object" ? JSON.stringify(arg) : String(arg);
                    } catch (e) {
                        return String(arg);
                    }
                }).join(" ");
                lines.push(((performance.now() / 1000).toFixed(1)) + "s " + level + ": " + text.slice(0, 2000));
                if (lines.length > 300) lines.shift();
                panel.textContent = lines.join("\n");
                if (!panel.isConnected) document.documentElement.appendChild(panel);
            };
            ["log", "info", "warn", "error"].forEach(function (level) {
                var original = console[level];
                console[level] = function () {
                    record(level, arguments);
                    return original.apply(console, arguments);
                };
            });
            window.addEventListener("error", function (event) {
                record("uncaught", [event.error || event.message]);
            });
            window.addEventListener("unhandledrejection", function (event) {
                record("rejection", [event.reason]);
            });
            var probe = document.createElement("canvas");
            var gl = probe.getContext("webgl2");
            record("info", [
                "UA: " + navigator.userAgent +
                "\nWebAssembly: " + typeof WebAssembly + ", GC: " + (typeof WebAssembly === "object" && supportsWasmGc()) +
                "\nWebGL2: " + (gl ? gl.getParameter(gl.VERSION) + ", max texture " + gl.getParameter(gl.MAX_TEXTURE_SIZE) : "unavailable") +
                "\nWindow: " + innerWidth + "x" + innerHeight + " @" + devicePixelRatio
            ]);
            // Every step of loading, so a hang can be located: downloads, WebAssembly compilation, a heartbeat.
            var debugFetch = window.fetch;
            window.fetch = function (input) {
                var url = String((input && input.url) || input).split("/").pop();
                record("fetch", ["start " + url]);
                return debugFetch.apply(this, arguments).then(function (response) {
                    record("fetch", [response.status + " " + url + " (" + response.headers.get("content-length") + " bytes)"]);
                    return response;
                }, function (error) {
                    record("fetch", ["failed " + url + ": " + error]);
                    throw error;
                });
            };
            ["compile", "compileStreaming", "instantiate", "instantiateStreaming"].forEach(function (name) {
                var original = WebAssembly && WebAssembly[name];
                if (!original) return;
                WebAssembly[name] = function () {
                    record("wasm", [name + " start"]);
                    return original.apply(WebAssembly, arguments).then(function (result) {
                        record("wasm", [name + " done"]);
                        return result;
                    }, function (error) {
                        record("wasm", [name + " failed: " + error]);
                        throw error;
                    });
                };
            });
            // Count WebGL work per second and report shader failures, to see whether the app draws at all.
            var glCalls = {};
            if (window.WebGL2RenderingContext) {
                var gl2 = WebGL2RenderingContext.prototype;
                ["clear", "drawArrays", "drawElements", "bindFramebuffer", "viewport", "flush"].forEach(function (name) {
                    var original = gl2[name];
                    gl2[name] = function () {
                        glCalls[name] = (glCalls[name] || 0) + 1;
                        return original.apply(this, arguments);
                    };
                });
                var getShaderParameter = gl2.getShaderParameter;
                gl2.getShaderParameter = function (shader, name) {
                    var value = getShaderParameter.apply(this, arguments);
                    if (name === this.COMPILE_STATUS && !value) record("gl", ["shader failed: " + this.getShaderInfoLog(shader)]);
                    return value;
                };
                var getProgramParameter = gl2.getProgramParameter;
                gl2.getProgramParameter = function (program, name) {
                    var value = getProgramParameter.apply(this, arguments);
                    if (name === this.LINK_STATUS && !value) record("gl", ["link failed: " + this.getProgramInfoLog(program)]);
                    return value;
                };
            }
            var ticks = 0;
            var heartbeat = setInterval(function () {
                record("tick", [++ticks + " gl " + JSON.stringify(glCalls)]);
                glCalls = {};
                if (ticks >= 12) clearInterval(heartbeat);
            }, 1000);
            setTimeout(function () {
                var canvas = findCanvas(document);
                if (!canvas) return record("info", ["no canvas after 5 s"]);
                var rect = canvas.getBoundingClientRect();
                var context = canvas.getContext("webgl2");
                record("info", ["canvas " + canvas.width + "x" + canvas.height + ", css " + Math.round(rect.width) +
                    "x" + Math.round(rect.height) + ", WebGL2 " + (context ? (context.isContextLost() ? "lost" : "ok") : "none")]);
            }, 5000);
        }

        if (typeof WebAssembly !== "object") {
            fail("WebAssembly is not available (disabled or unsupported).");
        }
        window.addEventListener("error", function (event) {
            fail(event.message || String(event.error));
        });
        window.addEventListener("unhandledrejection", function (event) {
            fail(String(event.reason));
        });
        // Compose renders into a canvas inside a shadow root, which querySelector on the document cannot see.
        function findCanvas(root) {
            var elements = root.querySelectorAll("*");
            for (var i = 0; i < elements.length; i++) {
                var element = elements[i];
                if (element.tagName === "CANVAS") return element;
                var nested = element.shadowRoot && findCanvas(element.shadowRoot);
                if (nested) return nested;
            }
            return null;
        }

        var startedAt = Date.now();
        var startCheck = setInterval(function () {
            if (findCanvas(document)) {
                // Keep the element: errors after start-up are still shown on top of the app.
                if (!status.classList.contains("failed")) status.style.display = "none";
                clearInterval(startCheck);
            } else if (Date.now() - startedAt > 30000) {
                fail("The app did not start within 30 seconds.");
                clearInterval(startCheck);
            }
        }, 250);
    })();
</script>
<!-- Loaded at the end of <body>: the app attaches to document.body, which must exist by then. -->
<script src="composeApp.js"></script>
</body>
</html>
