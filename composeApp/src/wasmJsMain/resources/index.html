<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundDrop</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fcf8ff;
        }

        @media (prefers-color-scheme: dark) {
            html, body {
                background: #0f0d17;
                color: #e7e1f0;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .browser-note {
            font-family: system-ui, sans-serif;
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 24px;
            line-height: 1.5;
        }

        .browser-note code {
            display: block;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(127, 82, 255, 0.12);
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
<noscript>
    <p class="browser-note">
        SoundDrop needs JavaScript and a browser with WebAssembly GC support
        (Chrome 119+, Firefox 120+, Safari 18.2+).
    </p>
</noscript>
<div id="status" class="browser-note">Loading SoundDrop…</div>
<script>
    // Shows a readable message instead of a blank page when the app cannot start.
    (function () {
        var status = document.getElementById("status");
        var started = false;

        function fail(reason) {
            if (started) return;
            status.innerHTML =
                "<strong>SoundDrop could not start in this browser.</strong><br>" +
                "It needs WebAssembly with garbage collection: Chrome 119+, Firefox 120+ or Safari 18.2+. " +
                "Safari's Lockdown Mode turns WebAssembly off. Details:<code></code>";
            status.querySelector("code").textContent = reason;
        }

        if (typeof WebAssembly !== "object") {
            fail("WebAssembly is not available (disabled or unsupported).");
        }
        window.addEventListener("error", function (event) {
            fail(event.message || String(event.error));
        });
        window.addEventListener("unhandledrejection", function (event) {
            fail(String(event.reason));
        });
        new MutationObserver(function (_, observer) {
            if (document.querySelector("canvas")) {
                started = true;
                status.remove();
                observer.disconnect();
            }
        }).observe(document.body, { childList: true, subtree: true });
        setTimeout(function () {
            if (!document.querySelector("canvas")) fail("The app did not start within 30 seconds.");
        }, 30000);
    })();
</script>
<!-- Loaded at the end of <body>: the app attaches to document.body, which must exist by then. -->
<script src="composeApp.js"></script>
</body>
</html>
