name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS is needed for the iOS simulator tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Tests on every target
        run: ./gradlew allTests
      - name: Build Android, desktop, web and iOS
        run: >-
          ./gradlew :androidApp:assembleDebug :composeApp:jvmJar :composeApp:wasmJsBrowserDistribution
          :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Shared code report
        run: |
          ./gradlew sharedCodeReport
          cat build/reports/shared-code.md >> "$GITHUB_STEP_SUMMARY"
